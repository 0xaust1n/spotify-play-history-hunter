services:
  postgres:
    image: postgres:17-alpine
    container_name: spotify-history-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "to_be_or_no_to_be"
      POSTGRES_DB: spotify
    ports:
      - "5432:5432"
    volumes:
      - spotify_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spotify"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  spotify_postgres_data:
